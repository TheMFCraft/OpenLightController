<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>OpenLightController WebRemote</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0f12;
      --panel: #141a1f;
      --line: #2e3a45;
      --text: #e8eef3;
      --muted: #8b9aab;
      --accent: #3d9e7a;
      --danger: #c45c5c;
      --warn: #d4a017;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; }
    header {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 0.75rem; padding: 0.75rem 1rem; border-bottom: 1px solid var(--line); background: var(--panel);
    }
    h1 { margin: 0; font-size: 1.1rem; letter-spacing: 0.04em; }
    .meta { color: var(--muted); font-size: 0.85rem; }
    .clock { font-variant-numeric: tabular-nums; font-family: ui-monospace, monospace; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    button {
      border: 1px solid var(--line); background: #1c242c; color: var(--text);
      border-radius: 6px; padding: 0.55rem 0.85rem; font: inherit; cursor: pointer; min-height: 44px;
    }
    button.primary { background: var(--accent); color: #04140e; border-color: #2f7a5e; font-weight: 600; }
    button.danger { border-color: #7a3535; color: #ffd0d0; }
    button.on { box-shadow: 0 0 0 2px var(--warn); }
    main { padding: 0.75rem; display: grid; gap: 0.75rem; }
    .playbacks {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 0.5rem;
    }
    .pb {
      background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
      padding: 0.55rem; display: flex; flex-direction: column; align-items: center; gap: 0.45rem;
    }
    .pb label { font-size: 0.75rem; color: var(--muted); text-align: center; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    .pb-btns { display: flex; gap: 0.25rem; width: 100%; }
    .pb-btns button { flex: 1; padding: 0.45rem; }
    .cues { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 0.65rem; }
    .cues h2 { margin: 0 0 0.5rem; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .cue-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.35rem; max-height: 40vh; overflow: auto; }
    .cue-grid button { text-align: left; font-size: 0.85rem; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #555; margin-right: 6px; }
    .status-dot.on { background: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>OpenLightController <span class="status-dot" id="liveDot"></span></h1>
      <div class="meta"><span id="showName">—</span> · <span class="clock" id="clock">--:--:--</span></div>
    </div>
    <div class="actions">
      <button type="button" id="btnBlackout" class="danger">Blackout</button>
      <button type="button" id="btnOutput">Output</button>
      <button type="button" id="btnClear">Clear PGM</button>
    </div>
  </header>
  <main>
    <section class="playbacks" id="playbacks"></section>
    <section class="cues">
      <h2>Cues</h2>
      <div class="cue-grid" id="cues"></div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    let state = null;

    function tickClock() {
      $("clock").textContent = new Date().toLocaleTimeString();
    }
    setInterval(tickClock, 1000);
    tickClock();

    async function api(path, method = "GET", body) {
      const opts = { method, headers: { "Content-Type": "application/json" } };
      if (body !== undefined) opts.body = JSON.stringify(body);
      const res = await fetch(path, opts);
      if (!res.ok) throw new Error(await res.text());
      return res.status === 204 ? null : res.json();
    }

    function renderPlaybacks() {
      const root = $("playbacks");
      root.innerHTML = "";
      if (!state) return;
      state.playbacks.forEach((pb) => {
        const el = document.createElement("div");
        el.className = "pb";
        const label = document.createElement("label");
        label.textContent = pb.label + (pb.fading ? " ~" : "");
        const range = document.createElement("input");
        range.type = "range";
        range.min = 0;
        range.max = 1000;
        range.value = Math.round(pb.fader * 1000);
        range.onchange = () => api(`/api/playback/${pb.index}/fader`, "POST", { value: Number(range.value) / 1000 });
        const btns = document.createElement("div");
        btns.className = "pb-btns";
        const back = document.createElement("button");
        back.textContent = "◀";
        back.onclick = () => api(`/api/playback/${pb.index}/back`, "POST");
        const go = document.createElement("button");
        go.textContent = "GO";
        go.className = "primary";
        go.onclick = () => api(`/api/playback/${pb.index}/go`, "POST");
        btns.append(back, go);
        el.append(label, range, btns);
        root.appendChild(el);
      });
    }

    function renderCues() {
      const root = $("cues");
      root.innerHTML = "";
      if (!state) return;
      state.cueLists.forEach((list) => {
        list.cues.forEach((cue) => {
          const btn = document.createElement("button");
          btn.textContent = `${list.name} · ${cue.number} ${cue.name}`;
          btn.onclick = () => api("/api/fire-cue", "POST", { cueListId: list.id, cueId: cue.id });
          root.appendChild(btn);
        });
      });
    }

    function renderHeader() {
      if (!state) return;
      $("showName").textContent = state.name;
      $("liveDot").classList.toggle("on", state.outputEnabled);
      $("btnOutput").classList.toggle("on", state.outputEnabled);
      $("btnOutput").textContent = state.outputEnabled ? "Output On" : "Output Off";
      $("btnBlackout").classList.toggle("on", state.blackout);
      $("btnBlackout").textContent = state.blackout ? "Blackout ON" : "Blackout";
    }

    function renderAll() {
      renderHeader();
      renderPlaybacks();
      renderCues();
    }

    async function refresh() {
      try {
        state = await api("/api/state");
        renderAll();
      } catch (e) {
        console.error(e);
      }
    }

    $("btnBlackout").onclick = async () => {
      if (!state) return;
      await api("/api/blackout", "POST", { enabled: !state.blackout });
      await refresh();
    };
    $("btnOutput").onclick = async () => {
      if (!state) return;
      await api("/api/output", "POST", { enabled: !state.outputEnabled });
      await refresh();
    };
    $("btnClear").onclick = async () => {
      await api("/api/clear-programmer", "POST");
      await refresh();
    };

    refresh();
    setInterval(refresh, 400);
  </script>
</body>
</html>
